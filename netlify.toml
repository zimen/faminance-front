# Configuration Netlify pour Angular SPA
[build]
  # Commande de build
  command = "npm run build"
  # Dossier de sortie
  publish = "dist/family-finance-frontend"

# Redirection pour le routage côté client
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Headers de sécurité (optionnel mais recommandé)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache pour les assets statiques (optionnel)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
